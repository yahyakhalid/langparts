name: langparts
description: Find text in another language that has no lang attribute (WCAG 2.x SC 3.1.2 Language of Parts).
author: Yahya Khalid
branding:
  icon: globe
  color: blue

inputs:
  paths:
    description: Files, directories or globs to check, separated by spaces. Directories are searched for .html, .htm and .xhtml files.
    required: false
    default: "."
  fail-on:
    description: "Fail the step on: fail (default), review, or none."
    required: false
    default: fail
  sarif:
    description: Also write SARIF 2.1.0 to this file, for github/codeql-action/upload-sarif.
    required: false
    default: ""
  args:
    description: Extra command-line options, for example "--lang ar --ignore Acme,Widget".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install langparts
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    - name: Check language of parts
      shell: bash
      env:
        LP_PATHS: ${{ inputs.paths }}
        LP_FAIL_ON: ${{ inputs.fail-on }}
        LP_SARIF: ${{ inputs.sarif }}
        LP_ARGS: ${{ inputs.args }}
        LP_BIN: ${{ github.action_path }}/bin/langparts.js
      run: |
        set -f  # leave globs to langparts
        read -r -a paths <<< "$LP_PATHS"
        read -r -a extra <<< "$LP_ARGS"
        if [ -n "$LP_SARIF" ]; then
          node "$LP_BIN" "${paths[@]}" "${extra[@]}" --sarif --fail-on none > "$LP_SARIF" || true
        fi
        node "$LP_BIN" "${paths[@]}" "${extra[@]}" --fail-on "$LP_FAIL_ON"
